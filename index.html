<!doctype html>
<html lang="zh-CN" data-type="service">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="page-type" content="service">
  <meta name="site-kind" content="other">
  <meta name="description" content="AI 视频作品集。产品、人物与质地展示。">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="robots" content="noindex, nofollow">
  <title>AI 视频作品集</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#works">跳转到作品</a>
  <main>
    <header><h1>AI 视频作品集</h1></header>
    <div class="gallery" id="works" aria-label="视频作品"></div>
    <noscript><p>请启用 JavaScript 以浏览和播放作品。</p></noscript>
  </main>
  <dialog aria-labelledby="player-title">
    <div class="player-head"><h2 id="player-title"></h2><button class="close" aria-label="关闭视频" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <video id="player" controls playsinline preload="none"></video>
    <p id="error" role="status" hidden>视频暂时无法播放。<a id="direct-video">打开原视频</a></p>
  </dialog>
</body>
</html>
